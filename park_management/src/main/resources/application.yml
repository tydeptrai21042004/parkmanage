server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/parkdb
    username: park
    password: your_password
  jpa:
    hibernate:
      ddl-auto: update   # dev only; use migrations for prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.springframework.security: DEBUG
# Prefer ENV VARS for secrets in real environments, but this works for local dev
PAYOS_CLIENT_ID: 
PAYOS_API_KEY: 
PAYOS_CHECKSUM_KEY: 

jwt:
  secret: change-me-very-long-random-string-at-least-32-bytes-11111111111111111111111
  expire-time: 86400
  issuer: change-me-issuer

gemini:
  api-key: # prefer env var in real use
  model: gemini-2.0-flash

app:
  internal-topup-confirm-url: http://localhost:8080/api/local/topups/confirm
  webhook:
    base-url: "https://scored-overall-humanity-oem.trycloudflare.com"  # update when tunnel changes
    path: /api/payment/payos/webhook
